interface:
  display_name: 'Generate Scene Art with OpenAI'
  short_description: 'Generate chat assets and Flare 4K backgrounds'
  default_prompt: 'Use $generate-scene-openai for scene and shared raster art. Apply the accepted flat editorial cartoon style to all scene art: broad clean shapes, two-tone shading, and clearly drawn fictional people. Preserve scene geometry and clearance. Use Flare only for opaque 4K scene backgrounds. Use the built-in chat generator for desks, props, foregrounds, and other assets. Keep good native alpha unchanged and build runtime variants locally without enlargement. Do not use an API fallback for a missing chat tool.'
policy:
  allow_implicit_invocation: true
