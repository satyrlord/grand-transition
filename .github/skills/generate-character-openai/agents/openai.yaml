interface:
  display_name: 'Generate Character Art with OpenAI'
  short_description: 'Generate native-transparent cartoon character art'
  default_prompt: 'Use $generate-character-openai to generate one native-transparent flat editorial cartoon character per file. Never generate a sheet or lineup. The reference library has 18 separate masters: three heights, three builds, and male and female figures. All reference masters use the usual head-size class. Use the matching accepted master for a human selection and the fixed human style block word for word. Before a selection, examine the subject research and make a written caricature brief. Do not attach a photograph or put a real name in a prompt. Run the style-block and color prompt checks. Measure stature, head size, and contour width with calibrated tools, and examine the rendering at source and runtime scale. In-chat requests and corrective retries have no numeric limit and do not need per-request approval. Keep generation separate from artistic acceptance. For robots, use the robot module and preserve approved identity and construction. Do not use Flare for character art.'
policy:
  allow_implicit_invocation: true
