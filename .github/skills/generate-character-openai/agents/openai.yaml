interface:
  display_name: 'Generate Character Art with OpenAI'
  short_description: 'Generate native-transparent cartoon character art'
  default_prompt: 'Use $generate-character-openai to generate one native-transparent flat editorial cartoon character per file. Do not generate a sheet or lineup. For a human selection, attach five distinct researched web photographs as identity references. Use only the fixed written human style block for artistic instructions. Do not attach a design template or image style reference. Use the photographs and written brief for likeness. Keep fictional costume, props, proportions and comic action from the brief. Do not put a real name in a prompt. Examine likeness and comic expression before detailed measurements. Run the style-block and color prompt checks. Measure stature, head size and contour width with calibrated tools. Examine the rendering at source and runtime scales. Chat requests and necessary retries have no numeric limit or per-request approval. Keep generation separate from artistic acceptance. Use an accepted selection as the only pose reference. For robots, use the robot module, the fixed written robot style block and the approved robot identity reference. Do not use Flare for character art.'
policy:
  allow_implicit_invocation: true
