interface:
  display_name: 'Generate Character Art with OpenAI'
  short_description: 'Generate office clip-art characters and five-pose packages'
  default_prompt: 'Use $generate-character-openai for one given character work unit. Set review, selection, or package mode. Record if the session has a local image generation tool. Without one, generate the private identity design through the Flare API helper. Continue only from hashes that you examined. Before each request, write the prop table and the brief, and pass the prompt check of the prompt consistency reference. Do not send a completed request or a request without a recorded result again.'
policy:
  allow_implicit_invocation: true
