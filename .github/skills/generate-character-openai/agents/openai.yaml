interface:
  display_name: 'Generate Character Art with OpenAI'
  short_description: 'Generate native-transparent cartoon character art'
  default_prompt: 'Use $generate-character-openai to generate native-transparent flat editorial cartoon caricatures in chat. Use the accepted style master as the only style reference image and the fixed style block as the only style text. If the style master is not there, complete the Master branch first. Before a selection, visually inspect at least three distinct usable photos from reliable labeled web sources, target five, and change them into a written caricature brief. Do not attach a photo or put a real name in a prompt. Run the style block check and the color check before each request. Give each character its researched height class, head-size class, and nose shape. The style master is a sheet of three invented figures and gives the drawing technique only. Measure the stature, the head-height ratio, and the contour width, and compare each candidate with the style master on one sheet. Reject each rendering defect and generate again. For a robot, use the robot regeneration module and the robot style block, and preserve approved robot identity and construction. Do not use Flare for characters or repeat accepted work.'
policy:
  allow_implicit_invocation: true
