name: Release to GitHub Pages

# Milestone 031 release path. Pull requests run the Milestone 002 quality
# workflow, which runs the same gate and has no deployment job.
on:
  push:
    branches:
      - main
    # A docs-only push keeps the recorded release live. See Milestone 031.
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifact-digest: ${{ steps.digest.outputs.sha256 }}
      artifact-id: ${{ steps.upload.outputs.artifact_id }}
    steps:
      - name: Check out the commit of the change
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The game version counts all commits, so the build needs the full history.
          fetch-depth: 0
      - name: List the Git LFS objects
        run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-assets-id
      - name: Restore the Git LFS cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
      - name: Download the Git LFS objects
        run: git lfs pull
      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Use the npm version in packageManager
        run: npm install --global "$(node -p "require('./package.json').packageManager")"
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium and stable Chrome
        run: npx playwright install --with-deps chromium chrome
      - name: Run the release gate
        run: npm run ci
      - name: Upload the tested dist artifact
        id: upload
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./dist
      - name: Record the artifact digest and tool versions
        id: digest
        run: |
          digest="$(sha256sum "$RUNNER_TEMP/artifact.tar" | cut -d ' ' -f1)"
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"
          {
            echo "## Release artifact"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Artifact SHA-256: \`$digest\`"
            echo "- Node.js: \`$(node --version)\`"
            echo "- npm: \`$(npm --version)\`"
            echo "- Playwright: \`$(npx playwright --version)\`"
            echo "- Chrome: \`$(google-chrome --version)\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Serve the uploaded artifact outside production
        run: |
          mkdir "$RUNNER_TEMP/pages-artifact"
          tar -xf "$RUNNER_TEMP/artifact.tar" -C "$RUNNER_TEMP/pages-artifact"
          npx vite preview --outDir "$RUNNER_TEMP/pages-artifact" --host 127.0.0.1 --port 4173 --strictPort &
          curl --silent --show-error --fail --retry 60 --retry-delay 1 --retry-all-errors \
            http://127.0.0.1:4173/grand-transition/ > /dev/null
      - name: Smoke the artifact before deployment
        run: >-
          npm run test:published --
          --base-url http://127.0.0.1:4173/grand-transition/
          --artifact-dir "$RUNNER_TEMP/pages-artifact"
      - name: Keep release evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-build-evidence
          path: |
            test-results/
            tmp/release-hardening/
            tmp/published-smoke/
          if-no-files-found: ignore
          retention-days: 90

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page-url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the tested artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  published-smoke:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the commit of the change
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Use the npm version in packageManager
        run: npm install --global "$(node -p "require('./package.json').packageManager")"
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium and stable Chrome
        run: npx playwright install --with-deps chromium chrome
      - name: Download the deployed artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: github-pages
          path: ${{ runner.temp }}/deployed
      - name: Check the deployed artifact digest
        env:
          EXPECTED_DIGEST: ${{ needs.build.outputs.artifact-digest }}
        run: |
          echo "$EXPECTED_DIGEST  $RUNNER_TEMP/deployed/artifact.tar" | sha256sum --check
          mkdir "$RUNNER_TEMP/pages-artifact"
          tar -xf "$RUNNER_TEMP/deployed/artifact.tar" -C "$RUNNER_TEMP/pages-artifact"
      - name: Smoke the published release
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page-url }}
        run: >-
          npm run test:published --
          --base-url "$PAGE_URL"
          --artifact-dir "$RUNNER_TEMP/pages-artifact"
      - name: Keep published smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: published-smoke-evidence
          path: tmp/published-smoke/
          if-no-files-found: ignore
          retention-days: 90
