name: Quality gate

on:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: List the Git LFS objects
        run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-assets-id
      - name: Restore the Git LFS cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
      - name: Download the Git LFS objects
        run: git lfs pull
      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Use npm 12
        run: npm install --global npm@12.0.2
      - name: Install dependencies
        run: npm ci
      - name: Install browsers for game and audio checks
        run: npx playwright install --with-deps chromium firefox webkit chrome
      - name: Run the quality gate without deployment
        run: npm run quality:full
      - name: Keep release measurement evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence
          path: |
            test-results/
            tmp/release-hardening/
          if-no-files-found: ignore
          retention-days: 14
